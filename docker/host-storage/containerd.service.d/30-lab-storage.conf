[Unit]
RequiresMountsFor=/var/lib/libvirt/container-runtime/containerd /var/lib/containerd
BindsTo=var-lib-libvirt.mount var-lib-containerd.mount
After=var-lib-libvirt.mount var-lib-containerd.mount

[Service]
ExecStartPre=/usr/bin/mountpoint -q /var/lib/libvirt
ExecStartPre=/usr/bin/mountpoint -q /var/lib/containerd
