version: "3.3"

services:
  timesfm3-research:
    build:
      context: .
      dockerfile: docker/timesfm3-research.Dockerfile
    image: octobot-timesfm3-research:3.0.1-cpu
    restart: "no"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      OMP_NUM_THREADS: "12"
      MKL_NUM_THREADS: "12"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
    volumes:
      - .:/workspace:ro
      - ../octobot-local/backtesting/research:/research:ro
      - ../octobot-local/timesfm3:/output
      - ../octobot-local/timesfm3/model:/model:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    mem_limit: 24g
    cpus: 12
    pids_limit: 256
    command:
      - preflight
      - --futures
      - /research/binance_um_all_20220501_20260630.data
      - --futures-manifest
      - /research/binance_um_all_20220501_20260630.data.manifest.json
      - --spot
      - /research/binance_spot_all_20220501_20260630.data
      - --spot-manifest
      - /research/binance_spot_all_20220501_20260630.data.manifest.json
      - --funding
      - /research/binance_um_all_funding_20220501_20260630.json
      - --output
      - /output/preflight.json

  timesfm3-fetch:
    image: octobot-timesfm3-research:3.0.1-cpu
    restart: "no"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      HF_HOME: /tmp/huggingface
    volumes:
      - .:/workspace:ro
      - ../octobot-local/timesfm3:/output
      - ../octobot-local/timesfm3/model:/model
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    command:
      - download-checkpoint
      - --checkpoint
      - /model/checkpoint
      - --license-acceptance
      - /model/LICENSE_ACCEPTANCE.json
      - --output
      - /output/checkpoint-verification.json
